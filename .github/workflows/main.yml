name: Check and Build

env:
  kernel_repository: jianyi520/android_kernel_xiaomi_sdm845
  kernel_branch: lineage-22.2
  device: equuleus
  clang_version: 19
  defconfig: |
    vendor/xiaomi/mi845_defconfig
    vendor/xiaomi/equuleus.config
  kernel_patch: |
  kernelsu_patch: |

on:
  push:
  workflow_dispatch:
    inputs:
      allow_rebuild:
        description: "Allow Rebuild"
        type: boolean
        default: false

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set env
        run: |
          if [[ "$clang_version" = "r"* ]] || [[ "$clang_version" = "latest" ]]; then
              clang_type=aosp
          else
              clang_type=vanilla
          fi
          echo clang_type=$clang_type | tee -a $GITHUB_ENV

          if [[ "$clang_version" = "latest" ]]; then
              clang_version=$(curl -L https://android.googlesource.com/kernel/common/+/refs/heads/android-mainline/build.config.constants | grep -Eo 'r[0-9]{6}[a-z]?[0-9]?')
              echo clang_version=$clang_version | tee -a $GITHUB_ENV
          fi

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y \
              binutils-arm-linux-gnueabi \
              binutils-aarch64-linux-gnu \
              gcc-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.kernel_repository }}
          ref: ${{ env.kernel_branch }}

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: this-repo

      - name: Get latest kernel commit id
        run: |
          echo kernel_commit_id=$(git rev-parse HEAD) | tee -a $GITHUB_ENV

      - name: Merge defconfig
        run: |
          while read -r line; do
              if [ -z "$line" ] || [[ "$line" == "#"* ]]; then
                  continue
              fi
              echo "Merging defconfig: $line"
              cat arch/arm64/configs/$line >>arch/arm64/configs/merged_defconfig
          done <<<"$defconfig"

      - name: Setup ReSukiSU
        run: |
          # https://resukisu.org/guide/build.html
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          echo 'CONFIG_KSU=y' >>arch/arm64/configs/merged_defconfig
          echo 'CONFIG_KSU_MANUAL_HOOK=y' >>arch/arm64/configs/merged_defconfig
          echo 'CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y' >>arch/arm64/configs/merged_defconfig
          sed -i 's|^#source "drivers/kernelsu/Kconfig"|source "drivers/kernelsu/Kconfig"|' drivers/Kconfig
          sed -i 's|^#obj-$(CONFIG_KSU) += kernelsu/|obj-$(CONFIG_KSU) += kernelsu/|' drivers/Makefile
          # legacy hook cleanup for ReSukiSU UL
          sed -i 's/ksu_vfs_read_hook/ksu_init_rc_hook/g' fs/read_write.c
          perl -0pi -e 's/^#ifdef CONFIG_KSU\nextern bool is_ksu_transition.*?\n#endif\n//ms' security/selinux/hooks.c
          perl -0pi -e 's/^#ifdef CONFIG_KSU\n\tif \(is_ksu_transition.*?\n#endif\n//ms' security/selinux/hooks.c
          # add missing fstat ret hooks (inside function body)
          perl -0pi -e 's/(SYSCALL_DEFINE2\(newfstat, unsigned int, fd, struct stat __user \*, statbuf\)\n\{\n\tstruct kstat stat;\n\tint error = vfs_fstat\(fd, &stat\);\n)/$1#ifdef CONFIG_KSU\n\textern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n\tksu_handle_newfstat_ret(\&fd, \&statbuf);\n#endif\n/' fs/stat.c
          perl -0pi -e 's/(SYSCALL_DEFINE2\(fstat64, unsigned long, fd, struct stat64 __user \*, statbuf\)\n\{\n\tstruct kstat stat;\n\tint error = vfs_fstat\(fd, &stat\);\n)/$1#ifdef CONFIG_KSU\n\textern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n\tksu_handle_fstat64_ret(\&fd, \&statbuf);\n#endif\n/' fs/stat.c
          # expose selinux symbols for ReSukiSU
          sed -i 's/^static ssize_t (\*write_op\[\])(struct file \*, char \*, size_t) = {/ssize_t (*write_op[])(struct file *, char *, size_t) = {/' security/selinux/selinuxfs.c
          sed -i 's/^static const struct file_operations sel_handle_status_ops = {/const struct file_operations sel_handle_status_ops = {/' security/selinux/selinuxfs.c
          sed -i 's/^static DEFINE_MUTEX(sel_mutex);/DEFINE_MUTEX(sel_mutex);/' security/selinux/selinuxfs.c
          sed -i 's/^static struct page \*selinux_status_page;/struct page *selinux_status_page;/' security/selinux/ss/status.c
          sed -i 's/^static DEFINE_MUTEX(selinux_status_lock);/DEFINE_MUTEX(selinux_status_lock);/' security/selinux/ss/status.c
          sed -i 's/^static DEFINE_RWLOCK(policy_rwlock);/DEFINE_RWLOCK(policy_rwlock);/' security/selinux/ss/services.c
          # verify cleanup (hard fail if legacy hooks remain)
          grep -n "ksu_vfs_read_hook" fs/read_write.c && { echo "CLEANUP FAILED: ksu_vfs_read_hook"; exit 1; } || echo "legacy read hook removed"
          if grep -q "is_ksu_transition" security/selinux/hooks.c; then echo "CLEANUP FAILED: is_ksu_transition"; exit 1; else echo "is_ksu_transition removed"; fi
          grep -n "ksu_handle_newfstat_ret\|ksu_handle_fstat64_ret" fs/stat.c


      - name: Apply kernel patch
        run: |
          while read -r line; do
              if [ -z "$line" ] || [[ "$line" == "#"* ]]; then
                  continue
              fi
              echo "Applying kernel patch: $line"
              git apply "this-repo/patches/$line"
          done <<<"$kernel_patch"

      - name: Apply KernelSU patch
        run: |
          while read -r line; do
              if [ -z "$line" ] || [[ "$line" == "#"* ]]; then
                  continue
              fi
              echo "Applying KernelSU patch: $line"
              git apply -p2 --directory KernelSU/kernel "this-repo/patches/$line"
          done <<<"$kernelsu_patch"

      - name: "AOSP-Clang: Restore"
        id: aosp_clang_restore
        if: env.clang_type == 'aosp'
        uses: actions/cache/restore@v4
        with:
          path: aosp-clang
          key: aosp-clang-${{ env.clang_version }}

      - name: "AOSP-Clang: Download"
        id: aosp_clang_download
        if: env.clang_type == 'aosp' && steps.aosp_clang_restore.outputs.cache-hit != 'true'
        run: |
          aosp_clang_branch=$(
              case "$clang_version" in
              r365631c ) echo android11-release;;
              r383902 | r416183b) echo master-kernel-build-2021 ;;
              r450784e) echo master-kernel-build-2022 ;;
              r487747c) echo main-kernel-build-2023 ;;
              *) echo main ;;
              esac
          )
          mkdir -p aosp-clang
          curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$aosp_clang_branch/clang-$clang_version.tar.gz | tar xz -C aosp-clang

      - name: "AOSP-Clang: Save"
        id: aosp_clang_save
        if: env.clang_type == 'aosp' && steps.aosp_clang_download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: aosp-clang
          key: aosp-clang-${{ env.clang_version }}

      - name: "AOSP-Clang: Setup"
        if: env.clang_type == 'aosp'
        run: |
          echo PATH=$(pwd)/aosp-clang/bin:$PATH | tee -a $GITHUB_ENV

      - name: "Vanilla-Clang: Setup"
        if: env.clang_type == 'vanilla'
        run: |
          curl -L https://apt.llvm.org/llvm.sh | sudo bash -s -- $clang_version
          echo PATH=/usr/lib/llvm-$clang_version/bin:$PATH | tee -a $GITHUB_ENV

      - name: export flags
        run: |
          echo flags=" \
          O=out \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KCFLAGS=-Wno-error
          " | tee -a $GITHUB_ENV

      - name: Make defconfig
        run: |
          make $flags merged_defconfig
          
      - name: Verify KSU config
        run: |
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile || true
          ls -l drivers/kernelsu || true
          grep -q "CONFIG_KSU=y" out/.config && echo "KSU config OK" || { echo "KSU config MISSING - exit 1"; exit 1; }


      - name: Make
        run: |
          make $flags -j$(nproc --all)

      - name: Verify KSU driver in kernel image
        run: |
          zcat out/arch/arm64/boot/Image.gz-dtb > /tmp/kernel.img 2>/dev/null || true
          if grep -aq "KernelSU" /tmp/kernel.img; then echo "KSU driver OK"; else echo "KSU driver MISSING"; exit 1; fi

      - name: AnyKernel3
        run: |
          curl -Lo AnyKernel3.zip https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip
          unzip AnyKernel3.zip

          cat >AnyKernel3-master/anykernel.sh <<EOF
          properties() { '
          kernel.string=$kernel_repository $kernel_branch with ReSukiSU for $device
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=$device
          '; }

          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3-master/
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
              cp out/arch/arm64/boot/dtbo.img AnyKernel3-master/
          fi

          cd AnyKernel3-master
          rm -rf .git* README.md
          zip -r ../boot.zip *

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: boot
          path: AnyKernel3-master/*

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: resukisu-main
          update_release: true
          body: |
            Device:
            ${{ env.device }}

            Kernel:
            https://github.com/${{ env.kernel_repository }}/tree/${{ env.kernel_commit_id }}

            ReSukiSU:
            https://github.com/ReSukiSU/ReSukiSU
          files: |
            boot.zip
